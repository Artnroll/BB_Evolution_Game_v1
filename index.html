<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>BitBullz Evolution | Unity WebGL</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">

    <!-- PlayDeck bridge -->
    <script src="playdeckBridge.js"></script>

    <!-- Canvas container and scaling for portrait -->
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden; /* prevent page scroll */
        }

        #unity-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #unity-canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none; /* prevent browser scrolling */
        }
    </style>
</head>
<body>
    <div id="unity-container">
        <canvas id="unity-canvas" tabindex="-1"></canvas>
    </div>

    <script>
        const canvas = document.getElementById("unity-canvas");
        const container = document.getElementById("unity-container");
        const buildUrl = "Build";
        const loaderUrl = buildUrl + "/WebglBuild.loader.js";

        const config = {
            dataUrl: buildUrl + "/WebglBuild.data",
            frameworkUrl: buildUrl + "/WebglBuild.framework.js",
            codeUrl: buildUrl + "/WebglBuild.wasm",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "Artnroll Games",
            productName: "BitBullz Evolution",
            productVersion: "0.4",
            showBanner: (msg, type) => console.log(type, msg)
        };

        // Create Unity instance
        const script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = () => {
            createUnityInstance(canvas, config, (progress) => {
                // Optional: forward loading progress to PlayDeck
                if (window.playDeckBridge?.SetLoading) {
                    try { window.playDeckBridge.SetLoading(progress * 100); } catch (e) { console.warn(e); }
                }
            }).then((unityInstance) => {
                window.unityInstance = unityInstance;
                if (window.playDeckBridge?.init) {
                    window.playDeckBridge.init(unityInstance);
                }
                // Initial resize
                resizeCanvas();
            }).catch(err => console.error("Unity failed to load:", err));
        };
        document.body.appendChild(script);

        // Handle window resize to maintain portrait aspect ratio (9:16)
        function resizeCanvas() {
            if (!window.unityInstance) return;

            const targetAspect = 9 / 16;
            const width = container.clientWidth;
            const height = container.clientHeight;
            const windowAspect = width / height;

            if (windowAspect > targetAspect) {
                // Too wide, letterbox horizontally
                canvas.style.width = (height * targetAspect) + "px";
                canvas.style.height = height + "px";
            } else {
                // Too tall, letterbox vertically
                canvas.style.width = width + "px";
                canvas.style.height = (width / targetAspect) + "px";
            }
        }

        window.addEventListener('resize', resizeCanvas);

        // Forward Play button from Telegram
        window.addEventListener('message', (ev) => {
            const data = ev.data?.playdeck;
            if (!data || !window.unityInstance) return;
            if (data.method === 'play') {
                window.unityInstance.SendMessage('LoadingScreenUI', 'OnPlayButton');
            }
        });
    </script>
</body>
</html>
