<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>BitBullz Evolution | Unity WebGL</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">

    <!-- PlayDeck bridge -->
    <script src="playdeckBridge.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: black; /* safe background */
        }

        #unity-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        #unity-canvas {
            display: block;
        }
    </style>
</head>
<body>
    <div id="unity-container">
        <canvas id="unity-canvas" tabindex="-1"></canvas>
        <div id="unity-loading-bar" style="position:absolute;bottom:0;width:100%;height:5px;background:#333;">
            <div id="unity-progress-bar-full" style="width:0%;height:100%;background:#0f0;"></div>
        </div>
    </div>

    <script>
        const container = document.getElementById("unity-container");
        const canvas = document.getElementById("unity-canvas");
        const buildUrl = "Build";
        const loaderUrl = buildUrl + "/WebglBuild.loader.js";

        const config = {
            dataUrl: buildUrl + "/WebglBuild.data",
            frameworkUrl: buildUrl + "/WebglBuild.framework.js",
            codeUrl: buildUrl + "/WebglBuild.wasm",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "Artnroll Games",
            productName: "BitBullz Evolution",
            productVersion: "0.4",
            canvas: canvas,   // IMPORTANT: Unity takes control of the canvas
            showBanner: (msg, type) => console.log(type, msg)
        };

        // Load Unity
        const script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = () => {
            createUnityInstance(canvas, config, (progress) => {
                document.getElementById("unity-progress-bar-full").style.width = (progress * 100) + "%";
                if (window.playDeckBridge?.SetLoading) {
                    try { window.playDeckBridge.SetLoading(progress * 100); } catch (e) { console.warn(e); }
                }
            }).then(unityInstance => {
                window.unityInstance = unityInstance;
                if (window.playDeckBridge?.init) {
                    window.playDeckBridge.init(unityInstance);
                }
            }).catch(err => console.error("Unity failed to load:", err));
        };
        document.body.appendChild(script);

        // Listen to PlayDeck messages
        window.addEventListener('message', ev => {
            const data = ev.data?.playdeck;
            if (!data || !window.unityInstance) return;
            if (data.method === 'play') {
                window.unityInstance.SendMessage('LoadingScreenUI', 'OnPlayButton');
            }
        });

        // Optional: maintain portrait letterbox inside Unity
        function resizeCanvas() {
            if (!canvas) return;
            const targetAspect = 9 / 16;
            const w = container.clientWidth;
            const h = container.clientHeight;
            const currentAspect = w / h;

            if (currentAspect > targetAspect) {
                canvas.style.width = (h * targetAspect) + "px";
                canvas.style.height = h + "px";
            } else {
                canvas.style.width = w + "px";
                canvas.style.height = (w / targetAspect) + "px";
            }
        }
        window.addEventListener('resize', resizeCanvas);
        window.addEventListener('load', resizeCanvas);
    </script>
</body>
</html>
