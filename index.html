<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>BitBullz Evolution | Unity WebGL</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">

    <!-- Telegram WebApp -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background: #000;
        }

        #unity-canvas {
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none;
            background: black;
        }

        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            z-index: 100000;
        }

        /* SIMPLE NAME DISPLAY */
        #name-display {
            position: fixed;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.9);
            color: #00ff00;
            padding: 15px;
            border: 3px solid #00ff00;
            border-radius: 10px;
            font-family: Arial, sans-serif;
            font-size: 16px;
            font-weight: bold;
            z-index: 99999;
            max-width: 300px;
        }
    </style>
</head>
<body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading">Loading...</div>

    <!-- SIMPLE NAME DISPLAY -->
    <div id="name-display">
        <div>🔍 TELEGRAM NAME:</div>
        <div id="telegram-name">Checking...</div>
    </div>

    <script>
        // SIMPLE TELEGRAM NAME CHECK
        const nameDisplay = document.getElementById('telegram-name');

        function showName(name) {
            nameDisplay.textContent = name;
            nameDisplay.style.color = '#00ff00';
            console.log("📛 TELEGRAM NAME FOUND:", name);
        }

        function showError(error) {
            nameDisplay.textContent = error;
            nameDisplay.style.color = 'red';
            console.error("❌ TELEGRAM ERROR:", error);
        }

        // Check Telegram immediately
        if (window.Telegram && window.Telegram.WebApp) {
            console.log("✅ Telegram WebApp detected");

            const user = window.Telegram.WebApp.initDataUnsafe?.user;
            console.log("USER OBJECT:", user);

            if (user) {
                // Try different name fields
                const name = user.username || user.first_name || user.last_name || `User_${user.id}`;

                if (name) {
                    showName(name);

                    // Send to Unity when it loads
                    setTimeout(() => {
                        if (window.unityInstance) {
                            console.log("🚀 Sending name to Unity:", name);
                            window.unityInstance.SendMessage('LoginManager', 'OnUsernameReceived', name);
                        }
                    }, 3000);
                } else {
                    showError("No name fields found in user object");
                }
            } else {
                showError("No user data in Telegram");
                console.log("initDataUnsafe:", window.Telegram.WebApp.initDataUnsafe);
            }
        } else {
            showError("Not in Telegram Mini App");
        }
    </script>

    <!-- PlayDeck Bridge -->
    <script src="playdeckBridge.js"></script>

    <script>
        // Wait for DOM to load
        window.addEventListener('DOMContentLoaded', function () {
            const canvas = document.querySelector("#unity-canvas");
            const loadingElement = document.querySelector("#loading");
            const buildUrl = "Build";
            const loaderUrl = buildUrl + "/WebglBuild.loader.js";

            const hideLoading = () => {
                if (loadingElement) {
                    loadingElement.style.display = 'none';
                }
            };

            const config = {
                dataUrl: buildUrl + "/WebglBuild.data",
                frameworkUrl: buildUrl + "/WebglBuild.framework.js",
                codeUrl: buildUrl + "/WebglBuild.wasm",
                streamingAssetsUrl: "StreamingAssets",
                companyName: "Artnroll Games",
                productName: "BitBullz Evolution",
                productVersion: "0.4",
                devicePixelRatio: window.devicePixelRatio,
                showBanner: (msg, type) => {
                    if (type === 'progress') {
                        const progress = Math.round(msg * 100);
                        if (loadingElement) {
                            loadingElement.innerHTML = `Loading... ${progress}%`;
                        }
                    }
                }
            };

            const script = document.createElement("script");
            script.src = loaderUrl;
            script.onload = () => {
                createUnityInstance(canvas, config, (progress) => {
                    const progressPercent = Math.round(progress * 100);
                    if (loadingElement) {
                        loadingElement.innerHTML = `Loading... ${progressPercent}%`;
                    }
                }).then((unityInstance) => {
                    console.log("✅ Unity loaded successfully");
                    window.unityInstance = unityInstance;
                    hideLoading();
                }).catch(err => {
                    console.error("❌ Unity failed to load:", err);
                });
            };

            document.body.appendChild(script);
        });
    </script>
</body>
</html>
