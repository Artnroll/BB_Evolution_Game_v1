<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>BitBullz Evolution | Unity WebGL</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">

    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- AdsGram SDK -->
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background: #000;
        }

        #unity-canvas {
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none;
            background: black;
        }

        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            z-index: 1000;
        }

        #debug-info {
            position: fixed;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 10px;
            border-radius: 5px;
            font-family: Arial, sans-serif;
            font-size: 12px;
            z-index: 1000;
            max-width: 300px;
        }
    </style>
</head>
<body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading">Loading...</div>
    <div id="debug-info" style="display: none;">
        <div id="telegram-status">Checking Telegram...</div>
        <div id="username-status">Username: Unknown</div>
    </div>

    <!-- PlayDeck Bridge -->
    <script src="playdeckBridge.js"></script>

    <script>
        // Debug info
        function updateDebugInfo() {
            const debugInfo = document.getElementById('debug-info');
            const telegramStatus = document.getElementById('telegram-status');
            const usernameStatus = document.getElementById('username-status');

            const isTelegram = !!(window.Telegram && window.Telegram.WebApp);
            telegramStatus.textContent = `Telegram: ${isTelegram ? 'Yes' : 'No'}`;

            if (isTelegram) {
                const user = window.Telegram.WebApp.initDataUnsafe?.user;
                if (user) {
                    usernameStatus.textContent = `User: ${user.username ? '@' + user.username : user.first_name || 'Unknown'}`;
                } else {
                    usernameStatus.textContent = 'User: Not available';
                }
            } else {
                usernameStatus.textContent = 'User: Not in Telegram';
            }

            debugInfo.style.display = 'block';
        }

        // Wait for DOM to load
        window.addEventListener('DOMContentLoaded', function () {
            const canvas = document.querySelector("#unity-canvas");
            const loadingElement = document.querySelector("#loading");
            const buildUrl = "Build";
            const loaderUrl = buildUrl + "/WebglBuild.loader.js";

            console.log("Initializing WebGL build...");
            console.log("Telegram WebApp available:", !!(window.Telegram && window.Telegram.WebApp));

            if (window.Telegram && window.Telegram.WebApp) {
                console.log("Telegram WebApp initData:", window.Telegram.WebApp.initDataUnsafe);
                console.log("Telegram user:", window.Telegram.WebApp.initDataUnsafe?.user);
            }

            const hideLoading = () => {
                if (loadingElement) {
                    loadingElement.style.display = 'none';
                }
            };

            const pixelRatioCap = /Mobi|Android|iPhone|iPad|iPod/.test(navigator.userAgent)
                ? Math.min(window.devicePixelRatio, 1.5)
                : window.devicePixelRatio;

            const config = {
                dataUrl: buildUrl + "/WebglBuild.data",
                frameworkUrl: buildUrl + "/WebglBuild.framework.js",
                codeUrl: buildUrl + "/WebglBuild.wasm",
                streamingAssetsUrl: "StreamingAssets",
                companyName: "Your Company",
                productName: "Your Game",
                productVersion: "1.0",
                devicePixelRatio: pixelRatioCap,
                showBanner: (msg, type) => {
                    console.log(type, msg);
                    if (type === 'progress') {
                        const progress = Math.round(msg * 100);
                        if (loadingElement) {
                            loadingElement.innerHTML = `Loading... ${progress}%`;
                        }
                        if (window.playDeckBridge?.SetLoading) {
                            window.playDeckBridge.SetLoading(progress);
                        }
                    }
                }
            };

            console.log("Starting Unity WebGL build...");

            const script = document.createElement("script");
            script.src = loaderUrl;
            script.onload = () => {
                createUnityInstance(canvas, config, (progress) => {
                    const progressPercent = Math.round(progress * 100);
                    console.log("Loading progress:", progressPercent + "%");

                    if (loadingElement) {
                        loadingElement.innerHTML = `Loading... ${progressPercent}%`;
                    }

                    if (window.playDeckBridge?.SetLoading) {
                        window.playDeckBridge.SetLoading(progressPercent);
                    }
                }).then((unityInstance) => {
                    console.log("✅ Unity loaded successfully");
                    window.unityInstance = unityInstance;
                    hideLoading();

                    // Show debug info
                    updateDebugInfo();

                    // Initialize bridge with Unity instance
                    if (window.playDeckBridge?.init) {
                        window.playDeckBridge.init(unityInstance);
                    }

                }).catch(err => {
                    console.error("❌ Unity failed to load:", err);
                    if (loadingElement) {
                        loadingElement.innerHTML = "Failed to load game. Please refresh.";
                        loadingElement.style.color = "red";
                    }
                });
            };

            script.onerror = (err) => {
                console.error("❌ Failed to load Unity loader:", err);
                if (loadingElement) {
                    loadingElement.innerHTML = "Failed to load game. Please refresh.";
                    loadingElement.style.color = "red";
                }
            };

            document.body.appendChild(script);
        });
    </script>
</body>
</html>
