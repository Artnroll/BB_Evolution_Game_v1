<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>BitBullz Evolution | Unity WebGL</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background: #000;
        }

        #unity-canvas {
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none;
            background: black;
        }

        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            z-index: 10000;
        }

        #debug-window {
            position: fixed;
            top: 10px;
            left: 10px;
            width: 400px;
            background: rgba(0,0,0,0.9);
            color: lime;
            font-family: Arial;
            font-size: 12px;
            padding: 10px;
            z-index: 10001;
            border: 2px solid red;
        }
    </style>
</head>
<body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading">Loading...</div>

    <div id="debug-window">
        <div style="color: yellow; font-weight: bold;">TELEGRAM DATA:</div>
        <div id="debug-content">Checking...</div>
    </div>

    <script src="playdeckBridge.js"></script>
    <script>
        function debugLog(msg) {
            const content = document.getElementById('debug-content');
            if (content) content.innerHTML += msg + '<br>';
            console.log(msg);
        }

        // NEW APPROACH: Check everything without relying on Telegram.WebApp
        function getTelegramData() {
            debugLog('--- SCANNING FOR ANY TELEGRAM DATA ---');

            let foundData = false;

            // METHOD 1: Check if we're even in Telegram
            const isInTelegram = /Telegram|WebApp|tg/i.test(navigator.userAgent) ||
                window.location.href.includes('t.me') ||
                document.referrer.includes('t.me');

            debugLog('In Telegram: ' + isInTelegram);
            debugLog('User Agent: ' + navigator.userAgent.substring(0, 50));

            // METHOD 2: Check ALL window properties for Telegram data
            debugLog('--- Checking window properties ---');
            for (let key in window) {
                if (key.toLowerCase().includes('telegram') || key.toLowerCase().includes('tg')) {
                    debugLog('Found: ' + key + ' = ' + typeof window[key]);
                    foundData = true;
                }
            }

            // METHOD 3: Check URL parameters (Telegram often passes data here)
            const urlParams = new URLSearchParams(window.location.search);
            debugLog('--- URL Parameters ---');
            for (let [key, value] of urlParams.entries()) {
                debugLog(key + ': ' + value.substring(0, 50));
                if (key.toLowerCase().includes('user') || key.toLowerCase().includes('id') || key.toLowerCase().includes('data')) {
                    foundData = true;
                }
            }

            // METHOD 4: Check hash parameters
            if (window.location.hash) {
                debugLog('Hash: ' + window.location.hash.substring(0, 100));
            }

            // METHOD 5: Check document.referrer
            if (document.referrer) {
                debugLog('Referrer: ' + document.referrer);
            }

            // METHOD 6: Try to access Telegram if it exists (but don't rely on it)
            try {
                if (window.Telegram) {
                    debugLog('⚡ Telegram global exists!');
                    if (window.Telegram.WebApp) {
                        debugLog('⚡ Telegram.WebApp exists!');
                        const user = window.Telegram.WebApp.initDataUnsafe?.user;
                        if (user) {
                            debugLog('✅ USER FOUND VIA WEBAPP!');
                            debugLog('ID: ' + user.id);
                            debugLog('Username: @' + user.username);
                            sendToUnity(user);
                            return;
                        }
                    }
                }
            } catch (e) {
                debugLog('Telegram access error: ' + e);
            }

            // METHOD 7: Last resort - check for common Telegram data patterns
            debugLog('--- Checking for hidden data ---');

            // Check if there's any data in localStorage/sessionStorage from Telegram
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key && key.toLowerCase().includes('telegram')) {
                    debugLog('LocalStorage: ' + key + ' = ' + localStorage.getItem(key));
                }
            }

            if (!foundData) {
                debugLog('❌ NO TELEGRAM DATA FOUND IN ANY METHOD');
                debugLog('This is a regular web page without Telegram API');
                debugLog('Bot button might be opening as regular webview');

                // Create fallback user data
                const fallbackUser = {
                    id: Math.floor(Math.random() * 1000000),
                    username: 'telegram_user',
                    first_name: 'Telegram',
                    last_name: 'User',
                    is_premium: false
                };
                debugLog('Using fallback data with ID: ' + fallbackUser.id);
                sendToUnity(fallbackUser);
            }
        }

        function sendToUnity(userData) {
            debugLog('Sending to Unity: ' + JSON.stringify(userData));
            if (window.unityInstance && typeof window.unityInstance.SendMessage === 'function') {
                window.unityInstance.SendMessage('LoginManager', 'OnTelegramUserFullReceived', JSON.stringify(userData));
                debugLog('✅ Data sent to Unity!');
            } else {
                debugLog('❌ Unity not ready yet, will retry...');
                setTimeout(() => sendToUnity(userData), 1000);
            }
        }

        // START IMMEDIATELY
        window.addEventListener('DOMContentLoaded', function () {
            debugLog('DOM loaded - starting scan');
            setTimeout(getTelegramData, 1000);

            const canvas = document.querySelector("#unity-canvas");
            const loadingElement = document.querySelector("#loading");
            const buildUrl = "Build";
            const loaderUrl = buildUrl + "/WebglBuild.loader.js";

            const hideLoading = () => {
                if (loadingElement) loadingElement.style.display = 'none';
            };

            const pixelRatioCap = /Mobi|Android|iPhone|iPad|iPod/.test(navigator.userAgent)
                ? Math.min(window.devicePixelRatio, 1.5)
                : window.devicePixelRatio;

            const config = {
                dataUrl: buildUrl + "/WebglBuild.data",
                frameworkUrl: buildUrl + "/WebglBuild.framework.js",
                codeUrl: buildUrl + "/WebglBuild.wasm",
                streamingAssetsUrl: "StreamingAssets",
                companyName: "Artnroll Games",
                productName: "BitBullz Evolution",
                productVersion: "0.4",
                devicePixelRatio: pixelRatioCap,
                showBanner: (msg, type) => {
                    if (type === 'progress') {
                        const progressPercent = Math.round(msg * 100);
                        if (loadingElement) loadingElement.innerHTML = `Loading... ${progressPercent}%`;
                        if (window.PlayDeck_SetLoading) {
                            try { window.PlayDeck_SetLoading(progressPercent); } catch (e) { }
                        }
                    }
                }
            };

            const script = document.createElement("script");
            script.src = loaderUrl;
            script.onload = () => {
                createUnityInstance(canvas, config, (progress) => {
                    const progressPercent = Math.round(progress * 100);
                    if (loadingElement) loadingElement.innerHTML = `Loading... ${progressPercent}%`;
                    if (window.PlayDeck_SetLoading) {
                        try { window.PlayDeck_SetLoading(progressPercent); } catch (e) { }
                    }
                }).then((unityInstance) => {
                    debugLog('✅ Unity loaded');
                    window.unityInstance = unityInstance;
                    hideLoading();

                    if (window.playDeckBridge && typeof window.playDeckBridge.init === 'function') {
                        try { window.playDeckBridge.init(unityInstance); } catch (e) { console.warn(e); }
                    }
                }).catch(err => {
                    debugLog('❌ Unity failed: ' + err);
                    if (loadingElement) {
                        loadingElement.innerHTML = "Failed to load.";
                        loadingElement.style.color = "red";
                    }
                });
            };
            script.onerror = (err) => {
                debugLog('❌ Loader failed: ' + err);
                if (loadingElement) {
                    loadingElement.innerHTML = "Failed to load.";
                    loadingElement.style.color = "red";
                }
            };
            document.body.appendChild(script);
        });

        // Override the function
        window.getTelegramUserFull = function (unityObjectName, callbackMethod) {
            debugLog('getTelegramUserFull called');
            getTelegramData();
        };
    </script>
</body>
</html>
