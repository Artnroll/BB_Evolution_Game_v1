<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>BitBullz Evolution | Unity WebGL</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">

    <!-- TELEGRAM WEBAPP SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- ADSGRAM SDK - LOAD SYNCHRONOUSLY FIRST -->
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background: #000;
        }

        #unity-canvas {
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none;
            background: black;
        }

        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            z-index: 10000;
        }

        /* Add AdsGram status indicator */
        #adsgram-status {
            position: fixed;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 10px;
            border-radius: 5px;
            font-family: Arial, sans-serif;
            font-size: 12px;
            z-index: 10001;
        }
    </style>
</head>
<body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading">Loading...</div>
    <div id="adsgram-status">Checking AdsGram...</div>

    <!-- PlayDeck Bridge -->
    <script src="playdeckBridge.js"></script>

    <script>
        // Check AdsGram immediately when page loads
        console.log("🔍 Initial AdsGram check:", {
            adsGramExists: !!window.AdsGram,
            telegramExists: !!window.Telegram,
            inTelegram: !!(window.Telegram && window.Telegram.WebApp)
        });

        // Update AdsGram status
        function updateAdsGramStatus() {
            const statusElement = document.getElementById('adsgram-status');
            if (statusElement) {
                if (window.AdsGram) {
                    statusElement.innerHTML = `✅ AdsGram Loaded<br>Methods: ${Object.keys(window.AdsGram).join(', ')}`;
                    statusElement.style.background = 'rgba(0,255,0,0.8)';
                } else {
                    statusElement.innerHTML = `❌ AdsGram Not Loaded`;
                    statusElement.style.background = 'rgba(255,0,0,0.8)';
                }
            }
        }

        // Wait for DOM to load
        window.addEventListener('DOMContentLoaded', function () {
            const canvas = document.querySelector("#unity-canvas");
            const loadingElement = document.querySelector("#loading");
            const buildUrl = "Build";
            const loaderUrl = buildUrl + "/WebglBuild.loader.js";

            console.log("🔧 DOM loaded, checking dependencies...");
            console.log("Telegram available:", !!window.Telegram);
            console.log("AdsGram available:", !!window.AdsGram);

            // Update AdsGram status
            updateAdsGramStatus();

            // Try to load AdsGram again if not available
            if (!window.AdsGram && window.Telegram && window.Telegram.WebApp) {
                console.log("🔄 AdsGram not loaded, attempting to load manually...");
                loadAdsGramManually();
            }

            if (window.Telegram) {
                console.log("Telegram.WebApp:", window.Telegram.WebApp);
                console.log("Telegram user:", window.Telegram.WebApp?.initDataUnsafe?.user);
            }

            if (window.AdsGram) {
                console.log("AdsGram methods:", Object.keys(window.AdsGram));
            }

            const hideLoading = () => {
                if (loadingElement) {
                    loadingElement.style.display = 'none';
                }
            };

            const pixelRatioCap = /Mobi|Android|iPhone|iPad|iPod/.test(navigator.userAgent)
                ? Math.min(window.devicePixelRatio, 1.5)
                : window.devicePixelRatio;

            const config = {
                dataUrl: buildUrl + "/WebglBuild.data",
                frameworkUrl: buildUrl + "/WebglBuild.framework.js",
                codeUrl: buildUrl + "/WebglBuild.wasm",
                streamingAssetsUrl: "StreamingAssets",
                companyName: "Your Company",
                productName: "Your Game",
                productVersion: "1.0",
                devicePixelRatio: pixelRatioCap,
                showBanner: (msg, type) => {
                    console.log(type, msg);
                    if (type === 'progress') {
                        const progress = Math.round(msg * 100);
                        if (loadingElement) {
                            loadingElement.innerHTML = `Loading... ${progress}%`;
                        }
                    }
                }
            };

            console.log("🚀 Starting Unity WebGL build...");

            const script = document.createElement("script");
            script.src = loaderUrl;
            script.onload = () => {
                createUnityInstance(canvas, config, (progress) => {
                    const progressPercent = Math.round(progress * 100);
                    console.log("Loading progress:", progressPercent + "%");

                    if (loadingElement) {
                        loadingElement.innerHTML = `Loading... ${progressPercent}%`;
                    }
                }).then((unityInstance) => {
                    console.log("✅ Unity loaded successfully");
                    window.unityInstance = unityInstance;
                    hideLoading();

                    // Final AdsGram check
                    updateAdsGramStatus();

                    // FORCE SEND TELEGRAM USERNAME WHEN UNITY LOADS
                    console.log("🔄 Force-sending Telegram username to Unity...");
                    if (window.getTelegramUsername) {
                        window.getTelegramUsername('LoginManager', 'OnUsernameReceived');
                    }

                }).catch(err => {
                    console.error("❌ Unity failed to load:", err);
                    if (loadingElement) {
                        loadingElement.innerHTML = "Failed to load game. Please refresh.";
                        loadingElement.style.color = "red";
                    }
                });
            };

            script.onerror = (err) => {
                console.error("❌ Failed to load Unity loader:", err);
                if (loadingElement) {
                    loadingElement.innerHTML = "Failed to load game. Please refresh.";
                    loadingElement.style.color = "red";
                }
            };

            document.body.appendChild(script);
        });

        // Function to manually load AdsGram
        function loadAdsGramManually() {
            console.log("🔄 Attempting to load AdsGram manually...");

            const script = document.createElement('script');
            script.src = 'https://sad.adsgram.ai/js/sad.min.js';
            script.onload = function () {
                console.log("✅ AdsGram manually loaded successfully!");
                console.log("AdsGram object:", window.AdsGram);
                console.log("Available methods:", Object.keys(window.AdsGram));
                updateAdsGramStatus();
            };
            script.onerror = function () {
                console.error("❌ Failed to load AdsGram manually");
                updateAdsGramStatus();
            };
            document.head.appendChild(script);
        }

        // Try multiple times to load AdsGram
        setTimeout(() => {
            if (!window.AdsGram && window.Telegram && window.Telegram.WebApp) {
                console.log("🔄 Retry 1: Loading AdsGram...");
                loadAdsGramManually();
            }
        }, 2000);

        setTimeout(() => {
            if (!window.AdsGram && window.Telegram && window.Telegram.WebApp) {
                console.log("🔄 Retry 2: Loading AdsGram...");
                loadAdsGramManually();
            }
        }, 5000);
    </script>
</body>
</html>
