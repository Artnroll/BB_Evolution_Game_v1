<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>BitBullz Evolution | Unity WebGL</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">

    <!-- TELEGRAM WEBAPP SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- TRY DIFFERENT ADSGRAM SDK URL -->
    <script src="https://cdn.adsgram.ai/sdk.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background: #000;
        }

        #unity-canvas {
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none;
            background: black;
        }

        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            z-index: 10000;
        }

        #adsgram-status {
            position: fixed;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 10px;
            border-radius: 5px;
            font-family: Arial, sans-serif;
            font-size: 12px;
            z-index: 10001;
        }
    </style>
</head>
<body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading">Loading...</div>
    <div id="adsgram-status">Checking AdsGram...</div>

    <!-- PlayDeck Bridge -->
    <script src="playdeckBridge.js"></script>

    <script>
        // Enhanced AdsGram checking
        function checkAdsGramMethods() {
            const statusElement = document.getElementById('adsgram-status');
            if (!window.AdsGram) {
                if (statusElement) {
                    statusElement.innerHTML = "❌ AdsGram not loaded";
                    statusElement.style.background = 'rgba(255,0,0,0.8)';
                }
                return;
            }

            // Log ALL methods and properties of AdsGram
            console.log("=== ADSGRAM FULL INSPECTION ===");
            console.log("AdsGram object:", window.AdsGram);
            console.log("AdsGram methods:", Object.getOwnPropertyNames(window.AdsGram));

            // Check for common ad method names
            const possibleMethods = [
                'showRewarded', 'showRewardedAd', 'showAd', 'showInterstitial',
                'loadRewarded', 'loadAd', 'displayAd', 'showBanner'
            ];

            let foundMethods = [];
            for (const method of possibleMethods) {
                if (typeof window.AdsGram[method] === 'function') {
                    foundMethods.push(method);
                }
            }

            console.log("Found AdsGram methods:", foundMethods);

            if (statusElement) {
                if (foundMethods.length > 0) {
                    statusElement.innerHTML = `✅ AdsGram Loaded<br>Methods: ${foundMethods.join(', ')}`;
                    statusElement.style.background = 'rgba(0,255,0,0.8)';
                } else {
                    statusElement.innerHTML = `❌ AdsGram loaded but no ad methods found`;
                    statusElement.style.background = 'rgba(255,165,0,0.8)';
                }
            }
        }

        // Wait for DOM to load
        window.addEventListener('DOMContentLoaded', function () {
            const canvas = document.querySelector("#unity-canvas");
            const loadingElement = document.querySelector("#loading");
            const buildUrl = "Build";
            const loaderUrl = buildUrl + "/WebglBuild.loader.js";

            console.log("🔧 DOM loaded, checking AdsGram...");

            // Check AdsGram immediately and periodically
            checkAdsGramMethods();
            setTimeout(checkAdsGramMethods, 1000);
            setTimeout(checkAdsGramMethods, 3000);

            const hideLoading = () => {
                if (loadingElement) {
                    loadingElement.style.display = 'none';
                }
            };

            const pixelRatioCap = /Mobi|Android|iPhone|iPad|iPod/.test(navigator.userAgent)
                ? Math.min(window.devicePixelRatio, 1.5)
                : window.devicePixelRatio;

            const config = {
                dataUrl: buildUrl + "/WebglBuild.data",
                frameworkUrl: buildUrl + "/WebglBuild.framework.js",
                codeUrl: buildUrl + "/WebglBuild.wasm",
                streamingAssetsUrl: "StreamingAssets",
                companyName: "Your Company",
                productName: "Your Game",
                productVersion: "1.0",
                devicePixelRatio: pixelRatioCap,
                showBanner: (msg, type) => {
                    if (type === 'progress') {
                        const progress = Math.round(msg * 100);
                        if (loadingElement) {
                            loadingElement.innerHTML = `Loading... ${progress}%`;
                        }
                    }
                }
            };

            console.log("🚀 Starting Unity WebGL build...");

            const script = document.createElement("script");
            script.src = loaderUrl;
            script.onload = () => {
                createUnityInstance(canvas, config, (progress) => {
                    const progressPercent = Math.round(progress * 100);
                    if (loadingElement) {
                        loadingElement.innerHTML = `Loading... ${progressPercent}%`;
                    }
                }).then((unityInstance) => {
                    console.log("✅ Unity loaded successfully");
                    window.unityInstance = unityInstance;
                    hideLoading();

                    // Final AdsGram check
                    checkAdsGramMethods();

                    // Force send Telegram username
                    if (window.getTelegramUsername) {
                        window.getTelegramUsername('LoginManager', 'OnUsernameReceived');
                    }

                }).catch(err => {
                    console.error("❌ Unity failed to load:", err);
                    if (loadingElement) {
                        loadingElement.innerHTML = "Failed to load game. Please refresh.";
                        loadingElement.style.color = "red";
                    }
                });
            };

            script.onerror = (err) => {
                console.error("❌ Failed to load Unity loader:", err);
                if (loadingElement) {
                    loadingElement.innerHTML = "Failed to load game. Please refresh.";
                    loadingElement.style.color = "red";
                }
            };

            document.body.appendChild(script);
        });
    </script>
</body>
</html>
