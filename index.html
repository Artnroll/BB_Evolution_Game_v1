<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>BitBullz Evolution | Unity WebGL</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background: #000;
        }

        #unity-canvas {
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none;
            background: black;
        }

        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            z-index: 10000;
        }

        #debug-window {
            position: fixed;
            top: 10px;
            left: 10px;
            width: 400px;
            background: rgba(0,0,0,0.9);
            color: lime;
            font-family: Arial;
            font-size: 12px;
            padding: 10px;
            z-index: 10001;
            border: 2px solid red;
        }
    </style>
</head>
<body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading">Loading...</div>

    <div id="debug-window">
        <div style="color: yellow; font-weight: bold;">TELEGRAM DATA:</div>
        <div id="debug-content">Checking...</div>
    </div>

    <script src="playdeckBridge.js"></script>
    <script>
        function debugLog(msg) {
            const content = document.getElementById('debug-content');
            if (content) content.innerHTML += msg + '<br>';
            console.log(msg);
        }

        // SIMPLE TELEGRAM DATA EXTRACTION
        function getTelegramData() {
            debugLog('--- GETTING TELEGRAM DATA ---');

            // Method 1: Direct Telegram WebApp access
            if (window.Telegram && Telegram.WebApp) {
                debugLog('✓ Using Telegram WebApp API');
                const user = Telegram.WebApp.initDataUnsafe?.user;
                if (user) {
                    debugLog('✅ TELEGRAM USER FOUND!');
                    debugLog('ID: ' + user.id);
                    debugLog('Username: @' + (user.username || 'none'));
                    debugLog('Name: ' + (user.first_name || '') + ' ' + (user.last_name || ''));
                    debugLog('Premium: ' + (user.is_premium ? 'YES' : 'NO'));

                    // SEND TO UNITY IMMEDIATELY
                    if (window.unityInstance && typeof window.unityInstance.SendMessage === 'function') {
                        const userData = {
                            id: user.id,
                            username: user.username || "",
                            first_name: user.first_name || "",
                            last_name: user.last_name || "",
                            is_premium: user.is_premium || false
                        };
                        window.unityInstance.SendMessage('LoginManager', 'OnTelegramUserFullReceived', JSON.stringify(userData));
                        debugLog('✅ Data sent to Unity!');
                    }
                    return;
                }
            }

            // Method 2: Check URL parameters (fallback)
            const urlParams = new URLSearchParams(window.location.search);
            const tgWebAppData = urlParams.get('tgWebAppData');
            if (tgWebAppData) {
                debugLog('✓ Found tgWebAppData in URL');
                try {
                    const decoded = decodeURIComponent(tgWebAppData);
                    debugLog('Raw data: ' + decoded.substring(0, 100));
                } catch (e) {
                    debugLog('Error decoding: ' + e);
                }
            }

            // Method 3: Last resort - check initData
            if (window.Telegram?.WebApp?.initData) {
                debugLog('✓ Found initData: ' + window.Telegram.WebApp.initData.substring(0, 100));
            }

            debugLog('❌ No user data found yet - retrying...');

            // Keep trying every second
            setTimeout(getTelegramData, 1000);
        }

        // START IMMEDIATELY
        window.addEventListener('DOMContentLoaded', function () {
            debugLog('DOM loaded - starting Telegram scan');
            setTimeout(getTelegramData, 500);

            const canvas = document.querySelector("#unity-canvas");
            const loadingElement = document.querySelector("#loading");
            const buildUrl = "Build";
            const loaderUrl = buildUrl + "/WebglBuild.loader.js";

            const hideLoading = () => {
                if (loadingElement) loadingElement.style.display = 'none';
            };

            const pixelRatioCap = /Mobi|Android|iPhone|iPad|iPod/.test(navigator.userAgent)
                ? Math.min(window.devicePixelRatio, 1.5)
                : window.devicePixelRatio;

            const config = {
                dataUrl: buildUrl + "/WebglBuild.data",
                frameworkUrl: buildUrl + "/WebglBuild.framework.js",
                codeUrl: buildUrl + "/WebglBuild.wasm",
                streamingAssetsUrl: "StreamingAssets",
                companyName: "Artnroll Games",
                productName: "BitBullz Evolution",
                productVersion: "0.4",
                devicePixelRatio: pixelRatioCap,
                showBanner: (msg, type) => {
                    if (type === 'progress') {
                        const progressPercent = Math.round(msg * 100);
                        if (loadingElement) loadingElement.innerHTML = `Loading... ${progressPercent}%`;
                        if (window.PlayDeck_SetLoading) {
                            try { window.PlayDeck_SetLoading(progressPercent); } catch (e) { }
                        }
                    }
                }
            };

            const script = document.createElement("script");
            script.src = loaderUrl;
            script.onload = () => {
                createUnityInstance(canvas, config, (progress) => {
                    const progressPercent = Math.round(progress * 100);
                    if (loadingElement) loadingElement.innerHTML = `Loading... ${progressPercent}%`;
                    if (window.PlayDeck_SetLoading) {
                        try { window.PlayDeck_SetLoading(progressPercent); } catch (e) { }
                    }
                }).then((unityInstance) => {
                    debugLog('✅ Unity loaded - instance ready');
                    window.unityInstance = unityInstance;
                    hideLoading();

                    if (window.playDeckBridge && typeof window.playDeckBridge.init === 'function') {
                        try { window.playDeckBridge.init(unityInstance); } catch (e) { console.warn(e); }
                    }

                    // Force get Telegram data again now that Unity is ready
                    setTimeout(getTelegramData, 1000);
                }).catch(err => {
                    debugLog('❌ Unity failed: ' + err);
                    if (loadingElement) {
                        loadingElement.innerHTML = "Failed to load. Open console for details.";
                        loadingElement.style.color = "red";
                    }
                });
            };
            script.onerror = (err) => {
                debugLog('❌ Loader failed: ' + err);
                if (loadingElement) {
                    loadingElement.innerHTML = "Failed to load. Refresh the page.";
                    loadingElement.style.color = "red";
                }
            };
            document.body.appendChild(script);
        });

        // OVERRIDE the getTelegramUserFull function to use our method
        window.getTelegramUserFull = function (unityObjectName, callbackMethod) {
            debugLog('🔧 getTelegramUserFull called - scanning for data...');
            getTelegramData();
        };
    </script>
</body>
</html>
