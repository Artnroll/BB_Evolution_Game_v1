<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>BitBullz Evolution | Unity WebGL</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background: #000;
        }

        #unity-canvas {
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none;
            background: black;
        }

        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            z-index: 10000;
        }

        #debug-window {
            position: fixed;
            top: 10px;
            left: 10px;
            width: 400px;
            background: rgba(0,0,0,0.9);
            color: lime;
            font-family: Arial;
            font-size: 12px;
            padding: 10px;
            z-index: 10001;
            border: 2px solid red;
        }
    </style>
</head>
<body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading">Loading...</div>

    <div id="debug-window">
        <div style="color: yellow; font-weight: bold;">TELEGRAM DATA:</div>
        <div id="debug-content">Checking...</div>
    </div>

    <script src="playdeckBridge.js"></script>
    <script>
        function debugLog(msg) {
            const content = document.getElementById('debug-content');
            if (content) content.innerHTML += msg + '<br>';
            console.log(msg);
        }

        // FOCUS ON TELEGRAMWEBVIEWPROXY - This is the key!
        function getTelegramData() {
            debugLog('--- USING TELEGRAMWEBVIEWPROXY ---');

            // METHOD 1: Try TelegramWebviewProxy directly
            if (window.TelegramWebviewProxy) {
                debugLog('✅ TelegramWebviewProxy found!');

                // Try to get user data from the proxy
                try {
                    // Common methods in TelegramWebviewProxy
                    if (typeof TelegramWebviewProxy.getUser === 'function') {
                        const user = TelegramWebviewProxy.getUser();
                        debugLog('getUser(): ' + JSON.stringify(user));
                    }

                    if (typeof TelegramWebviewProxy.getUserData === 'function') {
                        const userData = TelegramWebviewProxy.getUserData();
                        debugLog('getUserData(): ' + JSON.stringify(userData));
                    }

                    // Check if user data is stored in the proxy object
                    for (let key in TelegramWebviewProxy) {
                        if (key.toLowerCase().includes('user') || key.toLowerCase().includes('data')) {
                            debugLog('Proxy.' + key + ': ' + JSON.stringify(TelegramWebviewProxy[key]));
                        }
                    }

                    // Try to access initData or similar
                    if (TelegramWebviewProxy.initData) {
                        debugLog('initData: ' + TelegramWebviewProxy.initData);
                    }

                } catch (e) {
                    debugLog('Error accessing proxy: ' + e);
                }
            }

            // METHOD 2: Parse the hash string (might contain user data)
            if (window.location.hash) {
                debugLog('--- PARSING HASH ---');
                debugLog('Hash: ' + window.location.hash);

                try {
                    // Try to parse as JSON (remove the #)
                    const hashData = JSON.parse(decodeURIComponent(window.location.hash.substring(1)));
                    debugLog('Parsed hash: ' + JSON.stringify(hashData));

                    if (hashData.user || hashData.initData) {
                        debugLog('✅ USER DATA IN HASH!');
                        extractUserFromHash(hashData);
                        return;
                    }
                } catch (e) {
                    debugLog('Hash not JSON: ' + e);

                    // Try URL decoding
                    try {
                        const decoded = decodeURIComponent(window.location.hash.substring(1));
                        debugLog('Decoded hash: ' + decoded);

                        // Look for user patterns in the decoded string
                        if (decoded.includes('user') || decoded.includes('id')) {
                            extractUserFromString(decoded);
                        }
                    } catch (e2) {
                        debugLog('Cannot decode hash: ' + e2);
                    }
                }
            }

            // METHOD 3: Try to use TelegramWebviewProxyProto
            if (window.TelegramWebviewProxyProto) {
                debugLog('TelegramWebviewProxyProto found');
                // This might have prototype methods we can use
            }

            // METHOD 4: Last resort - check if there's a way to request user data
            debugLog('--- REQUESTING USER DATA ---');
            requestTelegramUserData();
        }

        function extractUserFromHash(hashData) {
            debugLog('Extracting from hash...');

            let userData = null;

            if (hashData.user) {
                userData = hashData.user;
            } else if (hashData.initDataUnsafe && hashData.initDataUnsafe.user) {
                userData = hashData.initDataUnsafe.user;
            } else if (hashData.initData) {
                // Parse initData string (usually URL encoded)
                try {
                    const params = new URLSearchParams(hashData.initData);
                    const userStr = params.get('user');
                    if (userStr) {
                        userData = JSON.parse(decodeURIComponent(userStr));
                    }
                } catch (e) {
                    debugLog('Error parsing initData: ' + e);
                }
            }

            if (userData) {
                debugLog('✅ EXTRACTED USER: ' + JSON.stringify(userData));
                sendToUnity(userData);
            } else {
                debugLog('❌ No user data in hash');
            }
        }

        function extractUserFromString(dataString) {
            debugLog('Searching for user data in string...');

            // Look for common patterns
            const idMatch = dataString.match(/"id":\s*(\d+)/);
            const usernameMatch = dataString.match(/"username":\s*"([^"]*)"/);
            const firstNameMatch = dataString.match(/"first_name":\s*"([^"]*)"/);

            if (idMatch) {
                const userData = {
                    id: parseInt(idMatch[1]),
                    username: usernameMatch ? usernameMatch[1] : 'unknown',
                    first_name: firstNameMatch ? firstNameMatch[1] : 'User',
                    last_name: '',
                    is_premium: false
                };
                debugLog('✅ EXTRACTED FROM STRING: ' + JSON.stringify(userData));
                sendToUnity(userData);
                return;
            }

            debugLog('❌ No user patterns found in string');
        }

        function requestTelegramUserData() {
            debugLog('Requesting user data from Telegram...');

            // Try to post a message to request user data
            if (window.TelegramWebviewProxy && typeof TelegramWebviewProxy.postMessage === 'function') {
                try {
                    // Common Telegram WebApp messages to request user data
                    TelegramWebviewProxy.postMessage(JSON.stringify({
                        eventType: 'web_app_request_user_data',
                        eventData: {}
                    }));
                    debugLog('Posted request for user data');
                } catch (e) {
                    debugLog('Error posting message: ' + e);
                }
            }

            // Set up listener for response
            window.addEventListener('message', function (event) {
                debugLog('Message received: ' + JSON.stringify(event.data));
                if (event.data && event.data.user) {
                    debugLog('✅ USER DATA FROM MESSAGE: ' + JSON.stringify(event.data.user));
                    sendToUnity(event.data.user);
                }
            });

            // Fallback - create generic user data
            setTimeout(() => {
                debugLog('Using fallback Telegram user data');
                const fallbackUser = {
                    id: Date.now(),
                    username: 'telegram_user',
                    first_name: 'Telegram',
                    last_name: 'User',
                    is_premium: false
                };
                sendToUnity(fallbackUser);
            }, 3000);
        }

        function sendToUnity(userData) {
            debugLog('Sending to Unity: ' + JSON.stringify(userData));
            if (window.unityInstance && typeof window.unityInstance.SendMessage === 'function') {
                window.unityInstance.SendMessage('LoginManager', 'OnTelegramUserFullReceived', JSON.stringify(userData));
                debugLog('✅ Data sent to Unity!');
            } else {
                debugLog('Unity not ready, storing data...');
                // Store and retry
                window.pendingUserData = userData;
                setTimeout(() => sendToUnity(userData), 1000);
            }
        }

        // START IMMEDIATELY
        window.addEventListener('DOMContentLoaded', function () {
            debugLog('DOM loaded - scanning TelegramWebviewProxy');
            setTimeout(getTelegramData, 1000);

            // Your existing Unity loading code remains the same...
            const canvas = document.querySelector("#unity-canvas");
            const loadingElement = document.querySelector("#loading");
            const buildUrl = "Build";
            const loaderUrl = buildUrl + "/WebglBuild.loader.js";

            const hideLoading = () => {
                if (loadingElement) loadingElement.style.display = 'none';
            };

            const pixelRatioCap = /Mobi|Android|iPhone|iPad|iPod/.test(navigator.userAgent)
                ? Math.min(window.devicePixelRatio, 1.5)
                : window.devicePixelRatio;

            const config = {
                dataUrl: buildUrl + "/WebglBuild.data",
                frameworkUrl: buildUrl + "/WebglBuild.framework.js",
                codeUrl: buildUrl + "/WebglBuild.wasm",
                streamingAssetsUrl: "StreamingAssets",
                companyName: "Artnroll Games",
                productName: "BitBullz Evolution",
                productVersion: "0.4",
                devicePixelRatio: pixelRatioCap,
                showBanner: (msg, type) => {
                    if (type === 'progress') {
                        const progressPercent = Math.round(msg * 100);
                        if (loadingElement) loadingElement.innerHTML = `Loading... ${progressPercent}%`;
                        if (window.PlayDeck_SetLoading) {
                            try { window.PlayDeck_SetLoading(progressPercent); } catch (e) { }
                        }
                    }
                }
            };

            const script = document.createElement("script");
            script.src = loaderUrl;
            script.onload = () => {
                createUnityInstance(canvas, config, (progress) => {
                    const progressPercent = Math.round(progress * 100);
                    if (loadingElement) loadingElement.innerHTML = `Loading... ${progressPercent}%`;
                    if (window.PlayDeck_SetLoading) {
                        try { window.PlayDeck_SetLoading(progressPercent); } catch (e) { }
                    }
                }).then((unityInstance) => {
                    debugLog('✅ Unity loaded');
                    window.unityInstance = unityInstance;
                    hideLoading();

                    if (window.playDeckBridge && typeof window.playDeckBridge.init === 'function') {
                        try { window.playDeckBridge.init(unityInstance); } catch (e) { console.warn(e); }
                    }

                    // Send any pending user data now that Unity is ready
                    if (window.pendingUserData) {
                        sendToUnity(window.pendingUserData);
                    }
                }).catch(err => {
                    debugLog('❌ Unity failed: ' + err);
                    if (loadingElement) {
                        loadingElement.innerHTML = "Failed to load.";
                        loadingElement.style.color = "red";
                    }
                });
            };
            script.onerror = (err) => {
                debugLog('❌ Loader failed: ' + err);
                if (loadingElement) {
                    loadingElement.innerHTML = "Failed to load.";
                    loadingElement.style.color = "red";
                }
            };
            document.body.appendChild(script);
        });

        // Override the function
        window.getTelegramUserFull = function (unityObjectName, callbackMethod) {
            debugLog('getTelegramUserFull called');
            getTelegramData();
        };
    </script>
</body>
</html>
