<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>BitBullz Evolution | Unity WebGL</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">

    <!-- AdsGram SDK (common host). Keep this first so SDK can load early.
         If AdsGram gives a different script URL for you, replace this URL with theirs. -->
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background: #000;
        }

        #unity-canvas {
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none;
            background: black;
        }

        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            z-index: 10000;
        }

        /* Simple Debug Console */
        #debug-console {
            position: fixed;
            top: 10px;
            left: 10px;
            width: 400px;
            height: 200px;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid #00ff00;
            color: #00ff00;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            padding: 5px;
            overflow-y: auto;
            z-index: 10001;
        }
    </style>
</head>
<body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading">Loading...</div>

    <!-- Simple Debug Console -->
    <div id="debug-console"></div>

    <!-- PlayDeck bridge (our unified bridge) -->
    <script src="playdeckBridge.js"></script>

    <script>
        // Simple debug logging function
        function debugLog(message) {
            const console = document.getElementById('debug-console');
            if (console) {
                const div = document.createElement('div');
                div.textContent = message;
                console.appendChild(div);
                console.scrollTop = console.scrollHeight;
            }
            // Also log to real console
            if (window.console) {
                console.log(message);
            }
        }

        // Check Telegram environment
        function checkTelegramEnvironment() {
            debugLog("=== Checking Telegram Environment ===");

            // Check for Telegram WebApp
            if (window.Telegram && window.Telegram.WebApp) {
                debugLog("✓ Telegram WebApp found");
                debugLog("Platform: " + (window.Telegram.WebApp.platform || "unknown"));
                debugLog("Version: " + (window.Telegram.WebApp.version || "unknown"));

                // Check for user data
                if (window.Telegram.WebApp.initDataUnsafe && window.Telegram.WebApp.initDataUnsafe.user) {
                    const user = window.Telegram.WebApp.initDataUnsafe.user;
                    debugLog("✓ Telegram User Data Found:");
                    debugLog("  ID: " + user.id);
                    debugLog("  Username: " + (user.username || "none"));
                    debugLog("  Name: " + (user.first_name || "") + " " + (user.last_name || ""));
                    debugLog("  Premium: " + (user.is_premium ? "yes" : "no"));
                    return true;
                } else {
                    debugLog("✗ No user data in initDataUnsafe");
                    debugLog("initDataUnsafe: " + JSON.stringify(window.Telegram.WebApp.initDataUnsafe));
                }
            } else {
                debugLog("✗ Telegram WebApp not found");
            }

            // Check for other Telegram globals
            let foundGlobals = [];
            for (let key in window) {
                if (key.toLowerCase().includes('telegram') || key.toLowerCase().includes('tg')) {
                    foundGlobals.push(key);
                }
            }
            if (foundGlobals.length > 0) {
                debugLog("Other Telegram globals: " + foundGlobals.join(', '));
            }

            return false;
        }

        // Enhanced getTelegramUserFull with debug logging
        if (typeof window.getTelegramUserFull === 'function') {
            const originalGetTelegramUserFull = window.getTelegramUserFull;
            window.getTelegramUserFull = function (unityObjectName, callbackMethod) {
                debugLog("getTelegramUserFull called: " + unityObjectName + "." + callbackMethod);
                return originalGetTelegramUserFull.call(this, unityObjectName, callbackMethod);
            };
        }

        // wait DOMContentLoaded to create unity instance
        window.addEventListener('DOMContentLoaded', function () {
            debugLog("DOM Content Loaded - Starting Unity...");

            // Check Telegram environment after a short delay
            setTimeout(() => {
                debugLog("--- Telegram Environment Check ---");
                checkTelegramEnvironment();
            }, 1000);

            const canvas = document.querySelector("#unity-canvas");
            const loadingElement = document.querySelector("#loading");
            const buildUrl = "Build";
            const loaderUrl = buildUrl + "/WebglBuild.loader.js";

            function setAdsStatus(text, color) {
                if (!adsStatus) return;
                adsStatus.innerHTML = text;
                if (color) adsStatus.style.background = color;
            }

            const hideLoading = () => {
                if (loadingElement) loadingElement.style.display = 'none';
            };

            const pixelRatioCap = /Mobi|Android|iPhone|iPad|iPod/.test(navigator.userAgent)
                ? Math.min(window.devicePixelRatio, 1.5)
                : window.devicePixelRatio;

            const config = {
                dataUrl: buildUrl + "/WebglBuild.data",
                frameworkUrl: buildUrl + "/WebglBuild.framework.js",
                codeUrl: buildUrl + "/WebglBuild.wasm",
                streamingAssetsUrl: "StreamingAssets",
                companyName: "Artnroll Games",
                productName: "BitBullz Evolution",
                productVersion: "0.4",
                devicePixelRatio: pixelRatioCap,
                showBanner: (msg, type) => {
                    if (type === 'progress') {
                        const progressPercent = Math.round(msg * 100);
                        if (loadingElement) loadingElement.innerHTML = `Loading... ${progressPercent}%`;
                        // keep PlayDeck.SetLoading compatibility if used
                        if (window.PlayDeck_SetLoading) {
                            try { window.PlayDeck_SetLoading(progressPercent); } catch (e) { }
                        }
                    }
                }
            };

            const script = document.createElement("script");
            script.src = loaderUrl;
            script.onload = () => {
                debugLog("Unity loader loaded, creating instance...");
                createUnityInstance(canvas, config, (progress) => {
                    const progressPercent = Math.round(progress * 100);
                    if (loadingElement) loadingElement.innerHTML = `Loading... ${progressPercent}%`;
                    if (window.PlayDeck_SetLoading) {
                        try { window.PlayDeck_SetLoading(progressPercent); } catch (e) { }
                    }
                }).then((unityInstance) => {
                    debugLog("✓ Unity loaded successfully");
                    window.unityInstance = unityInstance;
                    hideLoading();

                    // give the bridge the unity instance if it has init method
                    if (window.playDeckBridge && typeof window.playDeckBridge.init === 'function') {
                        try {
                            window.playDeckBridge.init(unityInstance);
                            debugLog("✓ PlayDeck bridge initialized");
                        } catch (e) {
                            debugLog("✗ PlayDeck bridge error: " + e);
                        }
                    }

                    // Force get Telegram username once loaded (safe if function exists)
                    if (typeof window.getTelegramUserFull === 'function') {
                        try {
                            window.getTelegramUserFull('LoginManager', 'OnTelegramUserFullReceived');
                            debugLog("getTelegramUserFull called for LoginManager");
                        } catch (e) {
                            debugLog("getTelegramUserFull error: " + e);
                        }
                    } else {
                        debugLog("✗ getTelegramUserFull function not found");
                    }
                }).catch(err => {
                    debugLog("✗ Unity create failed: " + err);
                    if (loadingElement) {
                        loadingElement.innerHTML = "Failed to load. Open console for details.";
                        loadingElement.style.color = "red";
                    }
                });
            };
            script.onerror = (err) => {
                debugLog("✗ Failed loading Unity loader: " + err);
                if (loadingElement) {
                    loadingElement.innerHTML = "Failed to load. Refresh the page.";
                    loadingElement.style.color = "red";
                }
            };
            document.body.appendChild(script);
        });
    </script>
</body>
</html>
