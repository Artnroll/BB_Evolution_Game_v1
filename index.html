<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>BitBullz Evolution | Unity WebGL</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background: #000;
        }

        #unity-canvas {
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none;
            background: black;
        }

        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            z-index: 10000;
        }

        #debug-window {
            position: fixed;
            top: 10px;
            left: 10px;
            width: 400px;
            background: rgba(0,0,0,0.8);
            color: lime;
            font-family: Arial;
            font-size: 12px;
            padding: 10px;
            z-index: 10001;
            border: 1px solid lime;
        }
    </style>
</head>
<body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading">Loading...</div>

    <div id="debug-window">
        <div><strong>Debug Info:</strong></div>
        <div id="debug-content"></div>
    </div>

    <script src="playdeckBridge.js"></script>
    <script>
        function debugLog(msg) {
            const content = document.getElementById('debug-content');
            if (content) content.innerHTML += msg + '<br>';
            console.log(msg);
        }

        // Check ALL possible ways to get Telegram data
        function checkAllTelegramMethods() {
            debugLog('=== CHECKING ALL METHODS ===');

            // Method 1: Standard Telegram WebApp
            if (window.Telegram?.WebApp) {
                debugLog('✓ METHOD 1: Telegram WebApp');
                const user = Telegram.WebApp.initDataUnsafe?.user;
                if (user) {
                    debugLog('USER: ' + user.username + ' (ID: ' + user.id + ')');
                    return user;
                }
            }

            // Method 2: Check URL parameters (common in Mini Apps)
            const urlParams = new URLSearchParams(window.location.search);
            debugLog('URL Params: ' + Array.from(urlParams.keys()).join(', '));

            // Method 3: Check for tgWebAppData in URL
            const tgWebAppData = urlParams.get('tgWebAppData');
            if (tgWebAppData) {
                debugLog('✓ METHOD 2: tgWebAppData in URL');
                try {
                    const decoded = JSON.parse(atob(tgWebAppData));
                    debugLog('tgWebAppData: ' + JSON.stringify(decoded).substring(0, 100));
                } catch (e) {
                    debugLog('Error decoding tgWebAppData');
                }
            }

            // Method 4: Check for initData in URL
            const initData = urlParams.get('initData');
            if (initData) {
                debugLog('✓ METHOD 3: initData in URL');
                debugLog('initData: ' + initData.substring(0, 100));
            }

            // Method 5: Check for any Telegram-related globals
            debugLog('=== GLOBALS CHECK ===');
            for (let key in window) {
                if (key.toLowerCase().includes('telegram') || key.toLowerCase().includes('tg')) {
                    debugLog('Global: ' + key + ' = ' + typeof window[key]);
                }
            }

            debugLog('✗ NO TELEGRAM DATA FOUND');
            debugLog('This is a regular web page, not a Telegram Mini App');
            return null;
        }

        window.addEventListener('DOMContentLoaded', function () {
            // Your existing Unity loading code...
            const canvas = document.querySelector("#unity-canvas");
            const loadingElement = document.querySelector("#loading");
            const buildUrl = "Build";
            const loaderUrl = buildUrl + "/WebglBuild.loader.js";

            const hideLoading = () => {
                if (loadingElement) loadingElement.style.display = 'none';
            };

            const pixelRatioCap = /Mobi|Android|iPhone|iPad|iPod/.test(navigator.userAgent)
                ? Math.min(window.devicePixelRatio, 1.5)
                : window.devicePixelRatio;

            const config = {
                dataUrl: buildUrl + "/WebglBuild.data",
                frameworkUrl: buildUrl + "/WebglBuild.framework.js",
                codeUrl: buildUrl + "/WebglBuild.wasm",
                streamingAssetsUrl: "StreamingAssets",
                companyName: "Artnroll Games",
                productName: "BitBullz Evolution",
                productVersion: "0.4",
                devicePixelRatio: pixelRatioCap,
                showBanner: (msg, type) => {
                    if (type === 'progress') {
                        const progressPercent = Math.round(msg * 100);
                        if (loadingElement) loadingElement.innerHTML = `Loading... ${progressPercent}%`;
                        if (window.PlayDeck_SetLoading) {
                            try { window.PlayDeck_SetLoading(progressPercent); } catch (e) { }
                        }
                    }
                }
            };

            const script = document.createElement("script");
            script.src = loaderUrl;
            script.onload = () => {
                createUnityInstance(canvas, config, (progress) => {
                    const progressPercent = Math.round(progress * 100);
                    if (loadingElement) loadingElement.innerHTML = `Loading... ${progressPercent}%`;
                    if (window.PlayDeck_SetLoading) {
                        try { window.PlayDeck_SetLoading(progressPercent); } catch (e) { }
                    }
                }).then((unityInstance) => {
                    console.log("Unity loaded");
                    window.unityInstance = unityInstance;
                    hideLoading();

                    if (window.playDeckBridge && typeof window.playDeckBridge.init === 'function') {
                        try { window.playDeckBridge.init(unityInstance); } catch (e) { console.warn(e); }
                    }

                    // Check for Telegram data
                    setTimeout(checkAllTelegramMethods, 1000);

                    if (typeof window.getTelegramUsername === 'function') {
                        try { window.getTelegramUsername('LoginManager', 'OnUsernameReceived'); } catch (e) { }
                    }
                }).catch(err => {
                    console.error("Unity create failed:", err);
                    if (loadingElement) {
                        loadingElement.innerHTML = "Failed to load. Open console for details.";
                        loadingElement.style.color = "red";
                    }
                });
            };
            script.onerror = (err) => {
                console.error("Failed loading Unity loader:", err);
                if (loadingElement) {
                    loadingElement.innerHTML = "Failed to load. Refresh the page.";
                    loadingElement.style.color = "red";
                }
            };
            document.body.appendChild(script);
        });
    </script>
</body>
</html>
