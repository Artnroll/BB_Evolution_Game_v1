<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>BitBullz Evolution | Unity WebGL</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">

    <!-- AdsGram SDK -->
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background: #000;
        }

        #unity-canvas {
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none;
            background: black;
        }

        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            z-index: 10000;
        }

        /* DEBUG CONSOLE STYLES */
        #debug-console {
            position: fixed;
            top: 10px;
            left: 10px;
            width: 500px;
            height: 300px;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #00ff00;
            color: #00ff00;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            padding: 10px;
            overflow-y: auto;
            z-index: 10001;
            display: block;
        }

        #debug-toggle {
            position: fixed;
            top: 10px;
            right: 10px;
            background: #00ff00;
            color: black;
            border: none;
            padding: 5px 10px;
            cursor: pointer;
            z-index: 10002;
            font-family: Arial, sans-serif;
        }

        .debug-log {
            color: #ffffff;
        }

        .debug-warn {
            color: #ffff00;
        }

        .debug-error {
            color: #ff0000;
        }

        .debug-telegram {
            color: #00ffff;
            font-weight: bold;
        }

        .debug-success {
            color: #00ff00;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading">Loading...</div>

    <!-- DEBUG CONSOLE -->
    <div id="debug-console">
        <div class="debug-telegram">=== DEBUG CONSOLE STARTED ===</div>
    </div>
    <button id="debug-toggle" onclick="toggleDebug()">Hide Debug</button>

    <!-- PlayDeck bridge -->
    <script src="playdeckBridge.js"></script>

    <script>
        // DEBUG CONSOLE FUNCTIONS
        function debugLog(message, type = 'log') {
            const console = document.getElementById('debug-console');
            if (!console) return;

            const timestamp = new Date().toLocaleTimeString();
            const div = document.createElement('div');
            div.className = `debug-${type}`;
            div.innerHTML = `[${timestamp}] ${message}`;
            console.appendChild(div);
            console.scrollTop = console.scrollHeight;

            // Also log to real console if available
            if (window.console && window.console.log) {
                const logFn = window.console[type] || window.console.log;
                logFn.call(window.console, message);
            }
        }

        function toggleDebug() {
            const console = document.getElementById('debug-console');
            const button = document.getElementById('debug-toggle');
            if (console.style.display === 'none') {
                console.style.display = 'block';
                button.textContent = 'Hide Debug';
            } else {
                console.style.display = 'none';
                button.textContent = 'Show Debug';
            }
        }

        // Override the global console functions to also log to our debug console
        if (typeof console !== 'undefined') {
            const originalLog = console.log;
            const originalWarn = console.warn;
            const originalError = console.error;

            console.log = function (...args) {
                debugLog(args.join(' '), 'log');
                originalLog.apply(console, args);
            };

            console.warn = function (...args) {
                debugLog(args.join(' '), 'warn');
                originalWarn.apply(console, args);
            };

            console.error = function (...args) {
                debugLog(args.join(' '), 'error');
                originalError.apply(console, args);
            };
        }

        // TELEGRAM DEBUG FUNCTIONS
        window.debugTelegramEnvironment = function () {
            debugLog("=== TELEGRAM ENVIRONMENT DEBUG ===", 'telegram');

            try {
                // Check all possible Telegram objects
                const telegram = window.Telegram;
                const webApp = telegram?.WebApp;
                const initData = webApp?.initDataUnsafe;
                const user = initData?.user;

                debugLog(`window.Telegram exists: ${!!telegram}`, 'telegram');
                debugLog(`Telegram.WebApp exists: ${!!webApp}`, 'telegram');
                debugLog(`Telegram.WebApp.initDataUnsafe exists: ${!!initData}`, 'telegram');
                debugLog(`Telegram.WebApp.initDataUnsafe.user exists: ${!!user}`, 'telegram');

                if (webApp) {
                    debugLog(`WebApp version: ${webApp.version || 'unknown'}`, 'telegram');
                    debugLog(`WebApp platform: ${webApp.platform || 'unknown'}`, 'telegram');
                    debugLog(`WebApp initData: ${webApp.initData || 'none'}`, 'telegram');
                }

                if (user) {
                    debugLog("=== TELEGRAM USER DATA FOUND ===", 'success');
                    debugLog(`User ID: ${user.id}`, 'success');
                    debugLog(`Username: ${user.username}`, 'success');
                    debugLog(`First Name: ${user.first_name}`, 'success');
                    debugLog(`Last Name: ${user.last_name}`, 'success');
                    debugLog(`Premium: ${user.is_premium}`, 'success');
                } else {
                    debugLog("=== NO TELEGRAM USER DATA FOUND ===", 'error');
                }

                // Check for other Telegram-related objects
                debugLog("Searching for other Telegram globals...", 'telegram');
                let foundGlobals = [];
                for (let key in window) {
                    if (key.toLowerCase().includes('telegram') ||
                        key.toLowerCase().includes('tg') ||
                        key.toLowerCase().includes('webapp')) {
                        foundGlobals.push(key);
                        debugLog(`Found global: ${key}`, 'telegram');
                    }
                }

                if (foundGlobals.length === 0) {
                    debugLog("No Telegram-related globals found!", 'error');
                }

            } catch (e) {
                debugLog(`Telegram debug error: ${e.message}`, 'error');
            }

            debugLog("=== END TELEGRAM DEBUG ===", 'telegram');
        };

        // ENHANCED getTelegramUserFull with detailed logging
        window.getTelegramUserFull = function (unityObjectName, callbackMethod) {
            debugLog(`getTelegramUserFull called: ${unityObjectName}.${callbackMethod}`, 'telegram');

            function trySend() {
                try {
                    let userData = null;

                    debugLog("Checking for Telegram data...", 'telegram');

                    // Method 1: Standard Telegram WebApp format
                    if (window.Telegram?.WebApp?.initDataUnsafe?.user) {
                        const u = window.Telegram.WebApp.initDataUnsafe.user;
                        debugLog("Found Telegram user data via standard method!", 'success');
                        userData = {
                            id: u.id || 0,
                            username: u.username || "",
                            first_name: u.first_name || "",
                            last_name: u.last_name || "",
                            is_premium: u.is_premium || false
                        };
                    }
                    // Method 2: Check initData string
                    else if (window.Telegram?.WebApp?.initData) {
                        debugLog("Found initData string, attempting to parse...", 'telegram');
                        const initData = window.Telegram.WebApp.initData;
                        debugLog(`Raw initData: ${initData}`, 'telegram');
                        // You might need URL parsing here
                    }
                    // Method 3: Check for proxy
                    else if (window.TelegramGameProxy) {
                        debugLog("Found TelegramGameProxy", 'telegram');
                        debugLog(`TelegramGameProxy: ${JSON.stringify(window.TelegramGameProxy)}`, 'telegram');
                    }
                    else {
                        debugLog("No Telegram data found in standard locations", 'warn');
                    }

                    if (userData) {
                        debugLog(`Sending user data to Unity: ${JSON.stringify(userData)}`, 'success');
                        SendMessage(unityObjectName, callbackMethod, JSON.stringify(userData));
                        return true;
                    } else {
                        debugLog("No user data to send", 'warn');
                        return false;
                    }
                } catch (e) {
                    debugLog(`trySend error: ${e.message}`, 'error');
                    return false;
                }
            }

            // Try immediately
            debugLog("Attempting immediate send...", 'telegram');
            if (trySend()) {
                debugLog("Telegram data sent successfully on first try!", 'success');
                return;
            }

            // If not found, retry with detailed logging
            let tries = 0;
            const maxTries = 12;
            debugLog(`Starting retry loop (${maxTries} attempts)`, 'telegram');

            const interval = setInterval(() => {
                tries++;
                debugLog(`Retry attempt ${tries}/${maxTries}`, 'telegram');

                if (trySend()) {
                    debugLog(`Telegram data found on attempt ${tries}`, 'success');
                    clearInterval(interval);
                } else if (tries >= maxTries) {
                    debugLog(`Giving up after ${maxTries} attempts`, 'error');

                    // Send fallback data
                    const fallbackData = {
                        id: 0,
                        username: "unknown",
                        first_name: "Unknown",
                        last_name: "User",
                        is_premium: false
                    };

                    try {
                        debugLog("Sending fallback data to Unity", 'warn');
                        SendMessage(unityObjectName, callbackMethod, JSON.stringify(fallbackData));
                    } catch (e) {
                        debugLog(`Failed to send fallback: ${e.message}`, 'error');
                    }

                    clearInterval(interval);
                }
            }, 500);
        };

        // Wait for DOM and run Telegram debug
        window.addEventListener('DOMContentLoaded', function () {
            debugLog("DOM Content Loaded", 'log');

            // Run Telegram environment check after a short delay
            setTimeout(() => {
                debugLog("Running Telegram environment check...", 'telegram');
                window.debugTelegramEnvironment();
            }, 1000);

            const canvas = document.querySelector("#unity-canvas");
            const loadingElement = document.querySelector("#loading");
            const buildUrl = "Build";
            const loaderUrl = buildUrl + "/WebglBuild.loader.js";

            const hideLoading = () => {
                if (loadingElement) loadingElement.style.display = 'none';
            };

            const pixelRatioCap = /Mobi|Android|iPhone|iPad|iPod/.test(navigator.userAgent)
                ? Math.min(window.devicePixelRatio, 1.5)
                : window.devicePixelRatio;

            const config = {
                dataUrl: buildUrl + "/WebglBuild.data",
                frameworkUrl: buildUrl + "/WebglBuild.framework.js",
                codeUrl: buildUrl + "/WebglBuild.wasm",
                streamingAssetsUrl: "StreamingAssets",
                companyName: "Artnroll Games",
                productName: "BitBullz Evolution",
                productVersion: "0.4",
                devicePixelRatio: pixelRatioCap,
                showBanner: (msg, type) => {
                    if (type === 'progress') {
                        const progressPercent = Math.round(msg * 100);
                        if (loadingElement) loadingElement.innerHTML = `Loading... ${progressPercent}%`;
                        if (window.PlayDeck_SetLoading) {
                            try { window.PlayDeck_SetLoading(progressPercent); } catch (e) { }
                        }
                    }
                }
            };

            const script = document.createElement("script");
            script.src = loaderUrl;
            script.onload = () => {
                debugLog("Unity loader script loaded", 'log');
                createUnityInstance(canvas, config, (progress) => {
                    const progressPercent = Math.round(progress * 100);
                    if (loadingElement) loadingElement.innerHTML = `Loading... ${progressPercent}%`;
                    if (window.PlayDeck_SetLoading) {
                        try { window.PlayDeck_SetLoading(progressPercent); } catch (e) { }
                    }
                }).then((unityInstance) => {
                    debugLog("Unity instance created successfully", 'success');
                    window.unityInstance = unityInstance;
                    hideLoading();

                    if (window.playDeckBridge && typeof window.playDeckBridge.init === 'function') {
                        try {
                            window.playDeckBridge.init(unityInstance);
                            debugLog("PlayDeck bridge initialized", 'success');
                        } catch (e) {
                            debugLog(`PlayDeck bridge init error: ${e.message}`, 'error');
                        }
                    }

                    // Try to get Telegram data after Unity is loaded
                    debugLog("Attempting to get Telegram user data...", 'telegram');
                    if (typeof window.getTelegramUserFull === 'function') {
                        try {
                            window.getTelegramUserFull('LoginManager', 'OnTelegramUserFullReceived');
                            debugLog("getTelegramUserFull called", 'telegram');
                        } catch (e) {
                            debugLog(`getTelegramUserFull error: ${e.message}`, 'error');
                        }
                    }
                }).catch(err => {
                    debugLog(`Unity create failed: ${err}`, 'error');
                    if (loadingElement) {
                        loadingElement.innerHTML = "Failed to load. Open console for details.";
                        loadingElement.style.color = "red";
                    }
                });
            };
            script.onerror = (err) => {
                debugLog(`Failed loading Unity loader: ${err}`, 'error');
                if (loadingElement) {
                    loadingElement.innerHTML = "Failed to load. Refresh the page.";
                    loadingElement.style.color = "red";
                }
            };
            document.body.appendChild(script);
        });
    </script>
</body>
</html>
