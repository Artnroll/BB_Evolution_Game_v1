<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>BitBullz Evolution | Unity WebGL</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">

    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- CORRECT AdsGram SDK from documentation -->
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background: #000;
        }

        #unity-canvas {
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none;
            background: black;
        }

        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }
    </style>
</head>
<body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading">Loading...</div>

    <!-- PlayDeck Bridge -->
    <script src="playdeckBridge.js"></script>

    <script>
        // Wait for DOM to load
        window.addEventListener('DOMContentLoaded', function () {
            const canvas = document.querySelector("#unity-canvas");
            const loadingElement = document.querySelector("#loading");
            const buildUrl = "Build";
            const loaderUrl = buildUrl + "/WebglBuild.loader.js";

            console.log("Checking Telegram WebApp...");
            if (window.Telegram && window.Telegram.WebApp) {
                console.log("Telegram WebApp detected!");
                console.log("User data:", window.Telegram.WebApp.initDataUnsafe?.user);
            } else {
                console.log("Not in Telegram WebApp");
            }

            const hideLoading = () => {
                if (loadingElement) {
                    loadingElement.style.display = 'none';
                }
            };

            const pixelRatioCap = /Mobi|Android|iPhone|iPad|iPod/.test(navigator.userAgent)
                ? Math.min(window.devicePixelRatio, 1.5)
                : window.devicePixelRatio;

            const config = {
                dataUrl: buildUrl + "/WebglBuild.data",
                frameworkUrl: buildUrl + "/WebglBuild.framework.js",
                codeUrl: buildUrl + "/WebglBuild.wasm",
                streamingAssetsUrl: "StreamingAssets",
                companyName: "Your Company",
                productName: "Your Game",
                productVersion: "1.0",
                devicePixelRatio: pixelRatioCap,
                showBanner: (msg, type) => {
                    console.log(type, msg);
                    if (type === 'progress') {
                        const progress = Math.round(msg * 100);
                        if (loadingElement) {
                            loadingElement.innerHTML = `Loading... ${progress}%`;
                        }
                    }
                }
            };

            console.log("Starting Unity WebGL build...");

            const script = document.createElement("script");
            script.src = loaderUrl;
            script.onload = () => {
                createUnityInstance(canvas, config, (progress) => {
                    const progressPercent = Math.round(progress * 100);
                    console.log("Loading progress:", progressPercent + "%");

                    if (loadingElement) {
                        loadingElement.innerHTML = `Loading... ${progressPercent}%`;
                    }
                }).then((unityInstance) => {
                    console.log("✅ Unity loaded successfully");
                    window.unityInstance = unityInstance;
                    hideLoading();

                    // AUTO-SEND TELEGRAM USERNAME IF AVAILABLE
                    if (window.Telegram && window.Telegram.WebApp) {
                        const user = window.Telegram.WebApp.initDataUnsafe?.user;
                        if (user) {
                            let username = "";
                            if (user.username) {
                                username = "@" + user.username;
                            } else if (user.first_name) {
                                username = user.first_name;
                            } else if (user.id) {
                                username = "User_" + user.id;
                            }

                            console.log("Auto-sending Telegram username:", username);
                            unityInstance.SendMessage('LoginManager', 'OnUsernameReceived', username);
                        }
                    }

                }).catch(err => {
                    console.error("❌ Unity failed to load:", err);
                    if (loadingElement) {
                        loadingElement.innerHTML = "Failed to load game. Please refresh.";
                        loadingElement.style.color = "red";
                    }
                });
            };

            script.onerror = (err) => {
                console.error("❌ Failed to load Unity loader:", err);
                if (loadingElement) {
                    loadingElement.innerHTML = "Failed to load game. Please refresh.";
                    loadingElement.style.color = "red";
                }
            };

            document.body.appendChild(script);
        });
    </script>
</body>
</html>
